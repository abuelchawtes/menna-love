
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أسف واعتذار من القلب ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            overflow: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 90%;
            width: 450px;
            position: relative;
            z-index: 10;
        }

        h1 {
            color: #d63384;
            font-size: 26px;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            min-height: 60px;
        }

        button {
            padding: 12px 35px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn-yes {
            background-color: #28a745;
            color: white;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.3);
        }

        .btn-yes:hover {
            transform: scale(1.1);
            background-color: #218838;
        }

        .btn-no {
            background-color: #dc3545;
            color: white;
            position: absolute;
            box-shadow: 0 4px 15px rgba(220, 53, 69, 0.3);
            transition: all 0.2s ease;
        }

        /* الصفحة الثانية */
        .page-2 {
            display: none;
        }

        .heart {
            font-size: 50px;
            animation: pulse 1s infinite alternate;
        }

        p {
            color: #444;
            font-size: 18px;
            line-height: 1.8;
            margin-top: 20px;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.2); }
        }

        /* القلوب الممتلئة بالشاشة */
        .bg-heart {
            position: absolute;
            color: #ff4b2b;
            font-size: 20px;
            animation: float 4s linear infinite;
            opacity: 0.6;
            z-index: 1;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- الصفحة الأولى (السؤال) -->
    <div class="container" id="page1">
        <h1>هل تقبلين أسفي واعتذاري؟ 🥺❤️</h1>
        <div class="buttons" id="btnContainer">
            <button class="btn-yes" onclick="showLovePage()">نعم 💕</button>
            <button class="btn-no" id="noBtn" onmouseover="moveButton()" onclick="moveButton()">لا 💔</button>
        </div>
    </div>

    <!-- الصفحة الثانية (الرسالة الرومانسية) -->
    <div class="container page-2" id="page2">
        <div class="heart">💖💍❤️</div>
        <h1>أنا آسف يا حبيبتي.. حقك عليّ!</h1>
        <p>
            ما تزعليش مني أبدًا، زعلتك غالية عليّ ومش هتحصل تاني وعد مني.. <br>
            أنتِ كل حاجة حلوة في حياتي، وضحكتك بالدنيا كلها والله ما هعمل كدة تاني ومقدرش علي زعلك وانا بحبك اوي اوي اوي يا ام البنات ياست البنات! 🥰✨
        </p>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        let moveCount = 0;

        // وظيفة تحريك زِر "لا" أو تحويله لـ "نعم"
        function moveButton() {
            moveCount++;
            
            // بعد 4 محاولات تلمس فيها زر لا، يتحول إلى "نعم"
            if (moveCount >= 4) {
                noBtn.innerText = "نعم 💕";
                noBtn.style.backgroundColor = "#28a745";
                noBtn.style.position = "static";
                noBtn.onclick = showLovePage;
                noBtn.onmouseover = null;
                return;
            }

            // تحريك الزر لمكان عشوائي داخل الشاشة
            const x = Math.random() * (window.innerWidth - 120);
            const y = Math.random() * (window.innerHeight - 60);

            noBtn.style.position = "fixed";
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;
        }

        // وظيفة الانتقال للصفحة الثانية وإظهار القلوب
        function showLovePage() {
            document.getElementById('page1').style.display = 'none';
            document.getElementById('page2').style.display = 'block';
            createHearts();
        }

        // توليد قلوب تسقط وتطير في الخلفية
        function createHearts() {
            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.classList.add('bg-heart');
                    heart.innerHTML = '❤️';
                    heart.style.left = Math.random() * 100 + 'vw';
                    heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
                    heart.style.fontSize = (Math.random() * 20 + 20) + 'px';
                    document.body.appendChild(heart);
                }, i * 150);
            }
        }
    </script>
</body>
</html>
